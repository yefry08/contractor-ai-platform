# Keeps "Territorios" and the dashboard's contract map current: classifies
# every contract by sector, reloads the official needs indicators (DANE,
# MEN, INE, ONE) and links the contracts ingested since the last run to
# their place. The indicators change once a year at most; the links change
# whenever new contracts arrive, hence monthly.
#
# Needs the same DATABASE_URL repository secret as opportunities.yml.
name: Refresh territories

on:
  schedule:
    - cron: "40 5 3 * *" # 05:40 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the DATABASE_URL repository secret to run this job."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # What each contract buys, for the dashboard's contract map. Contracts
      # loaded in between are classified when the map reads them.
      - name: Classify contracts by sector
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/classify_contracts.py
      - name: Refresh territories
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/ingest_territories.py
